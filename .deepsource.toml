version = 1

exclude_patterns = [
  "portal/node_modules/**",
  "portal/.next/**",
  "portal/out/**",
  ".venv/**",
  "venv/**",
  "**/__pycache__/**",
  ".pytest_cache/**",
  ".files/**",
  "data/**",
  "scratch/**",
  "supabase/.temp/**",
]

[[analyzers]]
name = "python"
enabled = true
dependency_file_paths = ["requirements.txt"]

  [analyzers.meta]
  runtime_version = "3.x.x"

[[analyzers]]
name = "javascript"
enabled = true
dependency_file_paths = ["portal"]

  [analyzers.meta]
  environment = ["nodejs", "browser"]
  module_system = "esmodules"

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "test-coverage"
enabled = true